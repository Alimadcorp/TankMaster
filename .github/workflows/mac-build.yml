name: macOS SFML Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install SFML via Homebrew
      run: |
        brew install sfml

    - name: Compile Application
      run: |
        SFML_PREFIX=$(brew --prefix sfml)
        
        g++ -std=c++17 main.cpp \
          -I"$SFML_PREFIX/include" \
          -L"$SFML_PREFIX/lib" \
          -framework OpenGL \
          -lsfml-graphics -lsfml-window -lsfml-system -lsfml-network -lsfml-audio \
          -o mac-app-binary

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-compiled-binary
        path: mac-app-binary
        if-no-files-found: error
