plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sfml.tankmaster'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "com.sfml.tankmaster"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DSFML_BUILD_AUDIO=OFF"
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "your_local_password"
            keyAlias System.getenv("KEY_ALIAS") ?: "tankmaster"
            keyPassword System.getenv("KEY_PASSWORD") ?: "your_local_password"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }
}